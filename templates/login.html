<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #060b1a;
    color: #e8edff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    gap: 28px;
}

.brand {
    text-align: center;
}
.brand-name {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .04em;
    color: #e8edff;
}
.brand-sub {
    font-size: 12px;
    color: #38bdf8;
    letter-spacing: .14em;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 4px;
}

.card {
    background: #131a2e;
    padding: 28px 24px;
    border-radius: 14px;
    width: 300px;
    border: 1px solid #283253;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

h2 {
    margin-top: 0;
    text-align: center;
    font-size: 15px;
    color: #8b97bd;
    font-weight: 500;
    margin-bottom: 16px;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
}

input {
    background: #0a1124;
    color: #e8edff;
    border: 1px solid #283253;
    font-size: 14px;
}
input:focus { outline: none; border-color: #38bdf8; }

button {
    background: #38bdf8;
    color: #060b1a;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
    letter-spacing: .03em;
    margin-top: 14px;
    transition: background .15s;
}
button:hover { background: #7dd3fc; }

.error {
    background: rgba(251,113,133,.15);
    border: 1px solid #fb7185;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    color: #fca5a5;
    font-size: 13px;
}
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/sleek.css') }}">
</head>
<body>

<div class="brand">
    <div class="brand-name">Baked After Dark</div>
    <div class="brand-sub">⚾ Sports Analytics</div>
</div>
<div class="card">
    <h2>Enter password to continue</h2>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="password" name="password" placeholder="Password" required autofocus>
        <button type="submit">Enter</button>
    </form>
</div>

</body>
</html>
